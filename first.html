<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <!-- Font Awesome for SVG/Font icons like Heart, Star, Shopping Cart -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 340px;
      padding: 16px;
      position: relative;
    }

    /* Top Image Area */
    .image-container {
      background-color: #f9f9f9;
      border-radius: 8px;
      position: relative;
      width: 100%;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge-bestseller {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: #ff6b35;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .wishlist-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ffffff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      color: #666;
    }

    .product-image {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .carousel-dots {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #ccc;
      border-radius: 50%;
    }

    .dot.active {
      background-color: #333;
    }

    /* Product Details */
    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111111;
      margin-bottom: 6px;
    }

    .rating-container {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .stars {
      color: #ffb400;
      display: flex;
      gap: 2px;
    }

    .rating-text {
      color: #666666;
      font-size: 0.8rem;
    }

    .product-description {
      font-size: 0.825rem;
      color: #666666;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    /* Add to Cart Button */
    .add-to-cart-btn {
      width: 100%;
      background-color: #ffc107;
      color: #212529;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .add-to-cart-btn:hover {
      background-color: #e0a800;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <!-- Image Header -->
    <div class="image-container">
      <span class="badge-bestseller">Bestseller</span>
      <button class="wishlist-btn" aria-label="Add to wishlist">
        <i class="fa-regular fa-heart"></i>
      </button>
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" alt="Wireless Headphones" class="product-image">
      <div class="carousel-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Details -->
    <h2 class="product-title">Wireless Headphones</h2>
    
    <div class="rating-container">
      <div class="stars">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-regular fa-star"></i>
      </div>
      <span class="rating-text">(4.2) | 1.2K reviews</span>
    </div>

    <p class="product-description">
      Premium wireless headphones with clear sound, long battery life and comfortable design.
    </p>

    <!-- Button -->
    <button class="add-to-cart-btn">
      <i class="fa-solid fa-cart-shopping"></i>
      Add to Cart
    </button>
  </div>

</body>
</html>
