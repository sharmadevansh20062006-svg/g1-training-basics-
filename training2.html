<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TCS and IEM AI Centre</title>

    <style>

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;

            /* Center the card */
            display: flex;
            justify-content: center;

            padding: 15px;
        }

        /* Main Card */
        .card {
            width: 510px;
            max-width: 100%;
        }

        /* Image */
        .card img {
            width: 100%;
            height: 287px;

            object-fit: cover;

            border-radius: 5px;

            display: block;
        }

        /* Heading */
        .card h1 {
            margin-top: 35px;

            font-size: 43px;
            font-weight: 400;
            line-height: 1.25;

            color: #111;
        }

        /* Description */
        .card p {
            margin-top: 25px;

            font-size: 25px;
            font-weight: 400;
            line-height: 1.48;

            color: #111;
        }

        /* Read More */
        .read-more {
            margin-top: 72px;
            padding-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #ddd;

            font-size: 25px;
            font-weight: 500;
        }

        /* Arrow */
        .arrow {
            font-size: 38px;
            font-weight: 300;
        }

    </style>

</head>


<body>

    <div class="card">

        <!-- Image -->
        <img
            src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1000&q=80"
            alt="People working together"
        >

        <!-- Heading -->
        <h1>
            TCS and IEM launch AI centre
        </h1>

        <!-- Description -->
        <p>
            The collaboration brings together TCS’
            industry expertise and IEM’s academic
            ecosystem to strengthen applied learning,
            research and innovation
        </p>

        <!-- Read More -->
        <div class="read-more">

            <span>
                Read more
            </span>

            <span class="arrow">
                →
            </span>

        </div>

    </div>

</body>

</html>
